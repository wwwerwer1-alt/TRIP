<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 유채꽃 가족여행 2027</title>
<meta name="description" content="2027년 3월 29일~4월 1일 제주 3박 4일 가족여행 일정, 예산, 식당 정리">
<style>
:root{
  --yellow:#F6C21C; --green:#7FA650; --teal:#256F8C; --orange:#F2994A;
  --bg:#FFF9E8; --card:#FFFFFF; --ink:#2B2B2B; --sub:#6B6558; --line:#EFE6C8;
  --shadow:0 2px 10px rgba(80,60,0,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161B22; --card:#1F2630; --ink:#F3EFE2; --sub:#A9A594; --line:#2D3541; --shadow:0 2px 10px rgba(0,0,0,.4);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
.app{max-width:560px;margin:0 auto;padding-bottom:48px}
.hero{position:relative;height:250px;background:#7FA650 center/cover;border-radius:0 0 28px 28px;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.65))}
.hero-text{position:absolute;left:20px;right:20px;bottom:20px;z-index:1;color:#fff}
.tag{display:inline-block;background:var(--yellow);color:#2B2B2B;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px}
.hero-text h1{margin:8px 0 2px;font-size:28px;letter-spacing:-.5px}
.hero-text p{margin:0;font-size:14px;opacity:.95}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{padding:16px}
h2{font-size:18px;margin:20px 0 10px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.stat{display:flex;gap:10px}
.stat .card{flex:1;padding:14px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
.daycard{display:flex;gap:12px;margin-bottom:12px;cursor:pointer;border:0;width:100%;text-align:left;padding:0;color:inherit;font:inherit}
.daycard .ph{width:104px;flex:none;background:#ddd center/cover}
.daycard .tx{padding:12px 12px 12px 0;flex:1}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;color:#2B2B2B}
.chip.teal{color:#fff}
.daycard h3{margin:6px 0 4px;font-size:16px}
.daycard p{margin:0;font-size:13px;color:var(--sub)}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:12px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--green)}
.check strong{display:block}
.check small{color:var(--sub)}
.dayhead{padding:18px 16px;border-radius:0 0 22px 22px}
.dayhead h2{margin:6px 0 2px;font-size:22px}
.dayhead p{margin:0;font-size:14px}
.sun{display:inline-block;margin-top:8px;background:rgba(255,255,255,.6);padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;color:#2B2B2B}
.tl{padding:8px 16px 0 16px}
.item{display:flex;gap:12px;margin-top:14px}
.time{flex:none;width:52px;font-weight:800;font-size:15px;padding-top:12px}
.item .card{flex:1;min-width:0}
.item .pic{height:150px;background:#ddd center/cover}
.credit{font-size:11px;color:var(--sub);padding:5px 14px 0}
.credit a{color:inherit}
.item .body{padding:12px 14px}
.item h3{margin:0 0 2px;font-size:16px}
.item p{margin:0;font-size:13px;color:var(--sub)}
.tip{margin-top:8px;font-size:12.5px;background:rgba(246,194,28,.18);padding:6px 10px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.price{font-size:15px;font-weight:800}
.btn{font-size:12px;font-weight:700;text-decoration:none;color:var(--ink);border:1px solid var(--line);padding:5px 10px;border-radius:99px}
.kind{font-size:11px;font-weight:700;margin-bottom:4px;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;font-weight:700;white-space:nowrap}
td small{display:block;font-weight:400;color:var(--sub);font-size:12px}
tr.total td{border-bottom:0;font-size:17px;background:rgba(246,194,28,.18)}
.note{font-size:12px;color:var(--sub);margin:12px 4px}
.verdict{padding:14px 16px;margin-top:12px}
.verdict b{display:block;margin-bottom:4px}
ul.plain{margin:6px 0;padding-left:20px;font-size:13.5px}
ul.plain li{margin:4px 0}
a{color:var(--teal)}
@media (prefers-color-scheme:dark){a{color:#7CC4E0}}
</style>
</head>
